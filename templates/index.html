{% extends "base.html" %}
{% block content %}
<div class="container py-4">
  <h2 class="mb-3">Systémové informace</h2>

  <div class="card shadow-sm">
    <div class="card-body">
      <ul class="mb-0">
        {% for k, v in info.items() %}
          <li class="mb-2">
            <b>{{ k }}:</b>
            <pre class="d-inline mb-0">{{ v }}</pre>
          </li>
        {% endfor %}
      </ul>
    </div>
  </div>
</div>
{% endblock %}
